<!-- Grin tour. Offer it, never force it: a "Fazer o tour" button, and the person can leave at any step. -->
<button type="button" class="btn" id="start-tour"><i data-icon="map"></i>Fazer o tour</button>
<script type="module">
  import { startTour } from './tour.js';
  document.getElementById('start-tour').addEventListener('click', () => startTour([
    { title: 'Agenda', text: 'O tour mostra onde buscar e onde importar. Cada passo pede uma ação na tela.' },
    { target: '#search', title: 'Busca', text: 'Por nome, e-mail ou empresa. A lista filtra enquanto você digita.',
      action: 'Digite um nome na busca', done: () => !!document.querySelector('#search input')?.value.trim() },
    { target: '#import', title: 'Importação', text: 'Linhas com problema aparecem primeiro, para corrigir antes de entrar na agenda.', action: 'Clique em Importar', click: true },
  ]));
</script>
