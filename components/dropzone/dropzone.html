<!-- Grin dropzone. Load dropzone.js and listen to "grin:files". -->
<label class="dropzone">
  <i data-icon="upload"></i>
  <b>Arraste um arquivo CSV ou XLSX para cá</b>
  <small>ou</small>
  <span class="btn">Escolher arquivo</span>
  <input type="file" accept=".csv,.xlsx">
</label>
<script type="module" src="dropzone.js"></script>
