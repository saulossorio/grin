<!-- Grin glossary. Each term has an id, so a .term popover or a link can point to it (#capex). -->
<div class="glossary">
  <div class="search"><i data-icon="search"></i><input class="input" type="search" placeholder="Buscar termo" aria-label="Buscar termo" data-glossary-search></div>
  <div class="letter-index" aria-label="Filtrar por letra"><button type="button" data-letter="">Todas</button><button type="button" data-letter="C">C</button><button type="button" data-letter="F">F</button><button type="button" data-letter="O">O</button></div>
  <section class="glossary-group" data-letter="C">
    <h2 class="glossary-letter">C</h2>
    <article class="glossary-item" id="capex"><div class="glossary-head"><h3>CAPEX</h3><span class="glossary-aka">Capital expenditure</span><span class="badge">Finanças</span></div><p>Gasto com bens que duram mais de um ano.</p></article>
  </section>
  <section class="glossary-group" data-letter="F">
    <h2 class="glossary-letter">F</h2>
    <article class="glossary-item" id="faixa"><div class="glossary-head"><h3>Faixa provável</h3><span class="badge">Método</span></div><p>Onde o valor real deve estar em 8 de cada 10 casos.</p></article>
  </section>
</div>
<script type="module" src="glossary.js"></script>
