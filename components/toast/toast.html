<!-- Grin toast. Usually created from JS: import { toast } from './toast.js'; toast('3 pessoas excluídas.', { action: 'Desfazer', onAction: undo }) -->
<div class="toast ok" role="status">
  <i data-icon="check-circle"></i>
  <div class="toast-text">3 pessoas excluídas.</div>
  <button type="button" class="link">Desfazer</button>
  <button type="button" class="btn icon xs ghost" aria-label="Fechar aviso"><i data-icon="x"></i></button>
</div>
