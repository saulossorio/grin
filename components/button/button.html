<!-- Grin button.
     <button type="button"> for actions; <a class="btn"> only to navigate.
     One .primary per area. Icons are decorative (aria-hidden); an icon-only button needs aria-label.
     A destructive button says what and how many: "Excluir 3 linhas", never just "OK". -->
<button type="button" class="btn primary">Salvar</button>
<button type="button" class="btn">Cancelar</button>
<button type="button" class="btn ghost">Limpar filtros</button>
<button type="button" class="btn dashed"><i data-icon="plus"></i>Adicionar coluna</button>
<button type="button" class="btn danger">Excluir 3 linhas</button>
<button type="button" class="btn icon" aria-label="Exportar"><i data-icon="download"></i></button>
<button type="button" class="btn" aria-busy="true" disabled><span class="spinner" aria-hidden="true"></span>Importando</button>
<div class="btn-group" role="group" aria-label="Exportar">
  <button type="button" class="btn">CSV</button><button type="button" class="btn">Excel</button>
</div>
<button type="button" class="link">Ver detalhes</button>
