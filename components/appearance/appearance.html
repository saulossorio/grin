<!-- Grin: the parts every tool built with Grin must have, in the sidebar.
     Logo with the version, Ajuda button with the help panel (help items and the signature), theme button (sun or moon,
     set by theme.js) and Aparência panel.
     Load scripts/theme.js, components/popover/popover.js, components/slider/slider.js and components/appearance/appearance.js
     (all included in dist/grin.js). -->
<nav class="sidebar" aria-label="Navegação principal">
  <a class="app-logo" href="#"><svg class="app-logo-mark" viewBox="0 0 100 86.6025" aria-hidden="true"><path d="M0 86.6025 50 0 100 86.6025Z"/></svg><span>Agenda</span><span class="tag">1.2</span></a>
  …
  <div class="sidebar-footer">
    <button type="button" class="nav-item small" aria-expanded="false" data-popover="help"><i data-icon="help-circle"></i><span class="label">Ajuda</span></button>
    <button type="button" class="nav-item small" data-theme-toggle><i data-icon="moon"></i><span class="label">Tema escuro</span></button>
    <button type="button" class="nav-item small" aria-expanded="false" data-popover="appearance"><i data-icon="sliders"></i><span class="label">Aparência</span></button>
  </div>
</nav>
<div class="popover appearance" id="appearance" data-appearance></div>
