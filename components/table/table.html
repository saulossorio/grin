<!-- Grin table: a card (.table-wrap) with header, toolbar, table and pagination. th scope="col"; the sorted column has aria-sort.
     First column: .cell-main with avatar, name and a second line. Numbers: .numeric (right-aligned, tabular).
     Cell states: .cell-crit, .cell-warn, .cell-edited; missing value: <span class="cell-empty">.
     .table-cards turns rows into cards on phones; each cell's data-label becomes its label there. -->
<section class="table-wrap table-cards" aria-labelledby="people-title">
  <div class="table-header"><div><h2 id="people-title">Lista de pessoas</h2><p class="text-secondary">Convidados com evento em 2026.</p></div></div>
  <div class="table-toolbar"><div class="search"><i data-icon="search"></i><input class="input" type="search" aria-label="Buscar pessoas" placeholder="Buscar por nome ou e-mail"></div><button type="button" class="btn"><i data-icon="filter"></i>Filtros</button></div>
  <table class="table">
    <thead><tr><th scope="col" class="select-col"><input type="checkbox" aria-label="Marcar todas"></th><th scope="col" aria-sort="ascending"><button type="button">Nome <i data-icon="chevron-down"></i></button></th><th scope="col">Situação</th><th scope="col" class="numeric">Eventos</th></tr></thead>
    <tbody>
      <tr aria-selected="true"><td class="select-col"><input type="checkbox" checked aria-label="Marcar Ana Lima"></td><td class="cell-edited"><div class="cell-main"><span class="avatar ok">AL</span><div><b>Ana Lima</b><small>ana.lima@nortesul.com.br</small></div></div></td><td data-label="Situação"><span class="badge ok"><span class="dot ok"></span>Pronta</span></td><td class="numeric" data-label="Eventos">4</td></tr>
      <tr><td class="select-col"><input type="checkbox" aria-label="Marcar Bruno Reis"></td><td><div class="cell-main"><span class="avatar info">BR</span><div><b>Bruno Reis</b><small class="text-crit">sem e-mail</small></div></div></td><td data-label="Situação"><span class="badge crit"><span class="dot crit"></span>Sem e-mail</span></td><td class="numeric" data-label="Eventos">1</td></tr>
    </tbody>
  </table>
  <div class="pagination"><span>2 de 2 pessoas</span><div class="pages"><button type="button" aria-current="page">1</button></div></div>
</section>
<div class="bulk-bar" role="toolbar" aria-label="Ações para 1 linha marcada"><span class="bulk-bar-count">1 marcada</span><span class="divider-v"></span><button type="button" class="btn xs danger"><i data-icon="trash"></i>Excluir 1</button></div>
