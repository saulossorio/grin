    <tbody>
      <tr aria-selected="true"><td class="select-col"><input type="checkbox" checked aria-label="Marcar Ana Lima"></td><td>Ana Lima</td><td class="cell-edited">ana.lima@nortesul.com.br</td><td class="numeric">4</td></tr>

    </tbody>
  </table>
</div>
